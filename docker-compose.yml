services:
  stb-control:
    image: ghcr.io/jarcos-al/stb-controller:latest
    # Para build local descomenta las siguientes líneas y comenta image de arriba:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # image: stb-control:local
    container_name: stb-control
    restart: unless-stopped
    ports:
      - "${STB_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - ./config:/config
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:-admin}
      - TZ=${TZ:-Europe/Madrid}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CONFIG_DIR=/config
      - DATA_DIR=/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
